apply plugin: 'java-library'
apply plugin: 'java-test-fixtures'

jar {
  archiveBaseName = 'web3signer-enclave-signer'
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': buildVersion,
      'Main-Class': 'tech.pegasys.web3signer.enclave.signer.EnclaveSignerApp'
      )
  }
}

// The enclave runs this jar and enclave-protocol, nothing else (see verifyEnclaveClasspath).
dependencies {
  implementation project(':enclave-protocol')

  testImplementation 'tech.pegasys.teku.internal:bls'
  testImplementation 'io.consensys.tuweni:tuweni-bytes'
  testImplementation 'org.bouncycastle:bcprov-jdk18on'
  testImplementation 'org.bouncycastle:bcpkix-jdk18on'
  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.junit.jupiter:junit-jupiter-api'
  testImplementation 'org.junit.jupiter:junit-jupiter-params'
  testRuntimeOnly 'tech.pegasys:jblst'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testFixturesApi project(':enclave-protocol')
  testFixturesRuntimeOnly 'tech.pegasys:jblst'
}
