apply plugin: 'java-library'
apply plugin: 'java-test-fixtures'

jar {
  archiveBaseName = 'web3signer-enclave-host'
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': buildVersion
      )
  }
}

// Host side of the enclave signer: sealing, key release and provisioning, benchmark.
// Must not depend on :signing, whose tests use this module's fixtures.
dependencies {
  api project(':enclave-protocol')
  implementation project(':bls-keystore')
  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'io.consensys.tuweni:tuweni-bytes'
  implementation 'org.apache.logging.log4j:log4j-api'
  implementation 'org.bouncycastle:bcpkix-jdk18on'
  implementation 'org.bouncycastle:bcprov-jdk18on'
  implementation 'software.amazon.awssdk:kms'
  implementation 'tech.pegasys.teku.internal:bls'

  // IAM Identity Center profiles in the default credentials chain, for `enclave seal`.
  runtimeOnly 'software.amazon.awssdk:sso'
  runtimeOnly 'software.amazon.awssdk:ssooidc'
  runtimeOnly 'tech.pegasys:jblst'

  testImplementation testFixtures(project(':enclave-signer'))
  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'
  testImplementation 'org.junit.jupiter:junit-jupiter-api'
  testImplementation 'org.junit.jupiter:junit-jupiter-params'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testFixturesApi project(':enclave-protocol')
  testFixturesApi 'tech.pegasys.teku.internal:bls'
  testFixturesRuntimeOnly 'tech.pegasys:jblst'
}

// Doclint as for the rest of the repository, except for missing comments.
javadoc {
  options.addStringOption('Xdoclint:all,-missing', '-quiet')
}
