// ./gradlew dependencyUpdates --no-parallel` to report outdated dependencies
dependencyManagement {
  imports {
    // Import log4j BOM first with higher priority
    mavenBom "org.apache.logging.log4j:log4j-bom:2.26.1"
    mavenBom 'org.junit:junit-bom:6.1.3'
    mavenBom 'io.netty:netty-bom:4.2.18.Final'
    mavenBom 'org.testcontainers:testcontainers-bom:2.0.5'

    // Pins the Jackson 3 family pulled in by web3j 6 and Vert.x 5 (via besu). web3j 6 parses
    // keystore files relying on As.EXTERNAL_PROPERTY support, which Jackson databind 3.2.1 no
    // longer provides: the sibling type-id property is not populated, leaving
    // WalletFile.Crypto.kdf null and failing every V3 keystore load. Keep the family on the
    // version shipped by the Vert.x 5 stack.
    mavenBom 'tools.jackson:jackson-bom:3.1.5'
  }

  dependencies {
    dependency 'com.google.code.findbugs:jsr305:3.0.2'
    dependency 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    dependency 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.3'

    dependencySet(group: 'com.google.errorprone', version: '2.50.0') {
      entry 'error_prone_annotation'
      entry 'error_prone_check_api'
      entry 'error_prone_core'
      entry 'error_prone_test_helpers'
    }

    dependency 'tech.pegasys.tools.epchecks:errorprone-checks:1.1.1'

    dependency 'com.google.guava:guava:33.7.1-jre'
    dependency 'com.github.ben-manes.caffeine:caffeine:3.3.0'

    dependency 'commons-cli:commons-cli:1.11.0'
    dependency 'commons-io:commons-io:2.22.0'
    dependency 'org.apache.commons:commons-lang3:3.20.0'
    dependency 'commons-logging:commons-logging:1.4.0'

    dependency 'info.picocli:picocli:4.7.7'

    dependencySet(group: 'io.vertx', version: '5.2.0') {
      entry 'vertx-core'
      entry 'vertx-web-client'
      entry 'vertx-web'
      entry 'vertx-junit5'
      entry 'vertx-health-check'
    }

    dependency 'javax.activation:activation:1.1.1'

    dependencySet(group: 'io.consensys.tuweni', version: '2.8.0') {
      entry 'tuweni-net'
      entry 'tuweni-bytes'
      entry 'tuweni-units'
      entry 'tuweni-io'
    }

    dependency 'org.assertj:assertj-core:3.27.7'

    dependency 'org.awaitility:awaitility:4.3.0'

    dependencySet(group: 'org.bouncycastle', version: '1.86') {
      entry 'bcpkix-jdk18on'
      entry 'bcprov-jdk18on'
    }

    dependency 'org.mock-server:mockserver-netty:8.0.0'

    dependencySet(group: 'org.mockito', version: '5.23.0') {
      entry 'mockito-core'
      entry 'mockito-inline'
      entry 'mockito-junit-jupiter'
    }

    dependency "org.hyperledger.besu:besu-plugin-api:${besuVersion}"
    dependency "org.hyperledger.besu.internal:besu-metrics-core:${besuVersion}"

    dependency 'org.xipki.iaik:sunpkcs11-wrapper:1.4.10'

    dependencySet(group: 'tech.pegasys.teku.internal', version: '26.9.0') {
      entry ('bls') {
        exclude group: 'org.bouncycastle', name: 'bcprov-jdk15on'
      }
      entry ('spec') {
        exclude group: 'org.bouncycastle', name: 'bcprov-jdk15on'
      }
      entry 'serializer'
      entry 'unsigned'
      entry 'async'
      entry ('networks') {
        // CVE-2025-48924
        exclude group: 'commons-lang', name: 'commons-lang'
      }
      entry ('json') {
        // CVE-2025-48924
        exclude group: 'commons-lang', name: 'commons-lang'
      }
      entry 'execution-types'
      entry 'kzg'
    }

    dependency 'tech.pegasys:jblst:0.3.18'

    dependency 'io.rest-assured:rest-assured:6.0.1'
    dependency 'org.zeroturnaround:zt-exec:1.13.0'
    dependencySet(group: 'org.web3j', version: '6.0.0') {
      entry 'besu'
      entry ('core') {
        exclude group: 'com.github.jnr', name: 'jnr-unixsocket'
        exclude group: 'org.bouncycastle', name: 'bcprov-jdk15on'
      }
      entry ('crypto') {
        exclude group: 'org.bouncycastle', name: 'bcprov-jdk15on'
      }
    }

    dependency 'com.github.arteam:simple-json-rpc-server:1.3'
    dependency 'com.github.arteam:simple-json-rpc-client:1.3'

    dependency 'com.azure:azure-security-keyvault-secrets:4.11.2'
    dependency 'com.azure:azure-security-keyvault-keys:4.11.2'
    dependency 'com.azure:azure-identity:1.18.6'

    dependency 'com.zaxxer:HikariCP:7.1.0'
    dependency 'org.postgresql:postgresql:42.7.13'

    dependencySet(group: 'org.jdbi', version: '3.54.0') {
      entry 'jdbi3-core'
      entry 'jdbi3-sqlobject'
      entry 'jdbi3-testing'
    }

    dependencySet(group: 'org.flywaydb', version: '13.7.0') {
        entry 'flyway-core'
        entry 'flyway-database-postgresql'
    }

    dependency 'com.google.cloud:google-cloud-secretmanager:2.97.0'

    dependency 'io.zonky.test.postgres:embedded-postgres-binaries-bom:18.6.0'
    dependency 'io.zonky.test:embedded-postgres:2.2.2'

    dependency 'com.github.ipld:java-cid:1.4.0'
    dependency 'net.jodah:failsafe:2.4.4'

    dependencySet(group: 'software.amazon.awssdk', version: '2.55.3') {
      entry 'bom'
      entry 'auth'
      entry 'secretsmanager'
      entry 'sts'
      entry 'kms'
    }

    dependencySet(group: 'com.squareup.okhttp3', version: '5.5.0') {
      entry 'okhttp'
      entry 'mockwebserver'
      entry 'logging-interceptor'   // CVE-2021-0341 via org.web3j:core:4.9.2
    }

    // addresses CVE-2023-3635
    dependency 'com.squareup.okio:okio:3.18.2'
      
    dependency 'io.projectreactor.netty:reactor-netty-http:1.3.7'

    dependency 'commons-net:commons-net:3.13.0'

    // manual overriding of json-smart to avoid CVE-2023-1370
    /*
     +--- com.azure:azure-identity -> 1.8.1
     |    +--- com.microsoft.azure:msal4j:1.13.5
     |    |    +--- com.nimbusds:oauth2-oidc-sdk:9.35
     |    |    |    +--- net.minidev:json-smart:[1.3.3,2.4.8] -> 2.4.8
     |    |    +--- net.minidev:json-smart:2.4.8 (*)
     */

    dependency 'net.minidev:json-smart:2.6.0'

    dependency 'com.nimbusds:nimbus-jose-jwt:10.10'

    // used in tests to assert log message
    dependency 'de.neuland-bfi:assertj-logging-log4j:0.5.0'

    // addresses CVE-2023-4759
    /*
         +--- com.google.errorprone:error_prone_check_api:2.11.0
          |    +--- io.github.java-diff-utils:java-diff-utils:4.0
     */
    dependency 'io.github.java-diff-utils:java-diff-utils:4.17'

    dependency 'org.wiremock:wiremock:3.13.2'
  }
}
