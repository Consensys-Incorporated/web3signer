name: Deploy OpenAPI docs to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      # Monitor specific paths for changes
      - 'openapi-specs/**'
jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      
      # v4.1.0
      - name: Deploy OpenAPI specs to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./openapi-specs
          destination_dir: ./openapi-specs