name: Feature Request
description: Suggest a new feature or enhancement for Web3Signer
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an enhancement!
        
        *Tip: If you would like to discuss an idea, RFC, or architectural design before proposing an implementation, consider opening a topic in [Discussions - Ideas](https://github.com/Consensys-Incorporated/web3signer/discussions/categories/ideas).*
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: "I am always frustrated when [...]"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you would like to see added to Web3Signer.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, workarounds, or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, API references, or EIP/specification links.
