name: Bug Report
description: File a bug report or regression in Web3Signer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue!
        
        ⚠️ **Security Reminder:** Never include private keys, keystore passwords, cloud credentials, or secrets in your report.
        
        *Note: If you have a setup question or need configuration help rather than reporting a bug, please use [GitHub Discussions](https://github.com/Consensys-Incorporated/web3signer/discussions/categories/q-a) instead.*
  - type: input
    id: version
    attributes:
      label: Web3Signer Version
      description: The version or Docker image tag of Web3Signer you are running.
      placeholder: e.g., 26.7.0 or develop
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Key Storage Backend
      description: Which key storage backend are you using?
      options:
        - Azure Key Vault
        - HashiCorp Vault
        - AWS KMS
        - Keystores / Local File
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Consensus / Validator Client (if applicable)
      placeholder: e.g., Teku, Lighthouse, Vouch
  - type: input
    id: environment
    attributes:
      label: Operating System / Environment
      placeholder: e.g., Ubuntu 24.04 amd64, macOS arm64, Docker, Kubernetes
  - type: textarea
    id: reproduction
    attributes:
      label: Description & Steps to Reproduce
      description: How can maintainers reproduce the issue? Include CLI flags or configuration (with credentials sanitized).
      placeholder: |
        1. Start Web3Signer with flags '...'
        2. Execute request '...'
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please paste any relevant stack traces or logs (ensure all secrets/passwords/tokens are redacted).
      render: shell
